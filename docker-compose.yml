volumes:
  prometheus_data: {}
  grafana_data: {}
  kafka_data: {}

services:
  go_api:
    build:
      context: .
      dockerfile: ./docker/go/Dockerfile
    container_name: markus_api
    volumes:
      - ./:/opt/app
    ports:
      - "${GO_PORT}:8080"
      - "${GO_DEBUG_PORT}:2345"
    restart: on-failure

  postgres:
    image: postgres:latest
    container_name: markus_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/PGDATA
    ports:
      - "${POSTGRES_PORT}:5432"

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    ports:
      - "${KAFKA_INTERNAL_PORT}:9092"    # Внутренний
      - "${KAFKA_EXTERNAL_PORT}:29092"   # Внешний
    environment:
      # KRaft mode settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://host.docker.internal:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # Cluster settings
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      
      # Log and storage settings
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      
      # Advertisement settings
    volumes:
      - kafka_data:/tmp/kafka-logs
    user: "root"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
    depends_on:
      - kafka

  prometheus:
    image: prom/prometheus:latest
    container_name: markus_prometheus
    volumes:
      - ./docker/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"

  grafana:
    image: grafana/grafana-enterprise
    container_name: markus_grafana
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_USER=${ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    restart: unless-stopped
    user: '0'
    ports:
      - '${GRAFANA_PORT}:3000'

  telegraf:
    image: telegraf:latest
    container_name: markus_telegraf
    volumes:
     - ./docker/telegraf/etc/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 10s
      retries: 5
    ports:
      - "${TELEGRAF_PORT}:8125/udp"
 
